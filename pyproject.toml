[project]
name = "sentinel-ops"
version = "0.1.0"
description = "Checkpointed incident triage with hybrid retrieval and approval-gated remediation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4", "langchain-openai>=1.0,<2",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "qdrant-client>=1.15,<2",
  "fastembed>=0.7,<1", "flashrank>=0.2.10,<0.3", "presidio-analyzer>=2.2,<3",
  "langfuse>=3,<4", "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "deepeval>=3,<4", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", ".sentinel"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "online: opt-in paid LLM evaluation",
  "models: downloads real embedding and reranking models",
]
