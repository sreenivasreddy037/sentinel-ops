name: SentinelOps quality gates
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_quality_eval:
        description: Run paid OpenAI RAG evaluation (requires repository secret)
        type: boolean
        default: false
concurrency:
  group: sentinel-ci-${{ github.ref }}
  cancel-in-progress: true
env:
  DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
  UV_PYTHON_PREFERENCE: only-managed
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.11"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run python scripts/check_repository.py
      - run: uv run pytest -v --junitxml=test-results.xml
        env:
          MOCK_LLM: "true"
          RUN_LLM_EVALS: "false"
      - run: MOCK_LLM=true uv run python scripts/demo_run.py
      - run: uv run python scripts/native_smoke.py
      - name: Install CI browser test client
        run: npm install --prefix "$RUNNER_TEMP/sentinel-browser" --no-package-lock --no-audit --no-fund playwright@1.56.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Exercise the incident console in a real browser
        run: node scripts/browser_smoke.mjs
        env:
          PLAYWRIGHT_PACKAGE_ROOT: ${{ runner.temp }}/sentinel-browser
          CHROME_BIN: /usr/bin/google-chrome
      - run: docker compose config --quiet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-results-and-lock
          path: |
            test-results.xml
            uv.lock
            dist/SentinelOps-console.png
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach --wait --wait-timeout 240
        env:
          MOCK_LLM: "true"
      - run: |
          python3 scripts/container_smoke.py
      - run: docker compose down --volumes
        if: always()
  retrieval-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.11"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest -v -m models
        env:
          MOCK_LLM: "true"
          RUN_MODEL_TESTS: "true"
          RUN_LLM_EVALS: "false"
  native-distribution:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.11"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest -v tests/test_distribution.py
        env:
          MOCK_LLM: "true"
      - run: uv run python scripts/native_smoke.py
      - name: Restore developer dependencies for the prepared Mac runtime
        if: runner.os == 'macOS'
        run: uv sync --frozen
      - name: Build prepared Mac runtime
        if: runner.os == 'macOS'
        run: uv run python scripts/build_portable.py
      - name: Verify the relocated Mac download
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/sentinel-relocated"
          tar -xzf dist/SentinelOps-macos-arm64.tar.gz -C "$RUNNER_TEMP/sentinel-relocated"
          cd "$RUNNER_TEMP/sentinel-relocated/SentinelOps"
          bash start.sh --verify
          .tools/python-runtime/bin/python3.12 scripts/portable_runner.py scripts.native_smoke
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: SentinelOps-macos-arm64
          path: dist/SentinelOps-macos-arm64.tar.gz
          retention-days: 30
  rag-evaluation:
    if: github.event_name == 'workflow_dispatch' && inputs.run_quality_eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.11"
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Require evaluation credential
        run: test -n "$OPENAI_API_KEY"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - run: uv run pytest -v -m models
        env:
          MOCK_LLM: "true"
          RUN_MODEL_TESTS: "true"
      - run: uv run pytest -v evals/test_rag_eval.py --junitxml=rag-results.xml
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RUN_LLM_EVALS: "true"
          DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rag-evaluation-results
          path: rag-results.xml
